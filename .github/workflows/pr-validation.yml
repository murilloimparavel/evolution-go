name: PR validation
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Go build, vet and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Install native image dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev libjpeg-turbo8-dev
      - run: go build ./...
      - run: go vet ./...
      - run: go test -timeout 10m ./...
  workflow-lint:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.24.4'
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows
        run: actionlint -shellcheck= -pyflakes=
  pr-ready:
    name: PR ready
    if: always()
    needs: [tests, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [job for job, result in results.items() if result['result'] != 'success']
          if failed:
              raise SystemExit('Required validation did not succeed: ' + ', '.join(failed))
          print('All required PR checks passed')
          PY_GATE
